<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Nour 💙</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    text-align: center;
    overflow: hidden;
    background: linear-gradient(to top, #ffffff, #ffe4ec, #d6ecff);
}

h1 {
    margin-top: 60px;
    color: #ff4f87;
}

p {
    font-size: 1.3em;
    color: #444;
}

button {
    padding: 15px 30px;
    font-size: 18px;
    border: none;
    border-radius: 25px;
    cursor: pointer;
    margin: 20px;
    transition: 0.3s;
}

.yes {
    background-color: #ff4f87;
    color: white;
}

.no {
    background-color: #87c7ff;
    color: white;
    position: absolute;
}

/* Balloons */
.balloon {
    position: absolute;
    bottom: -150px;
    width: 90px;
    height: 110px;
    border-radius: 50%;
    overflow: hidden;
    animation: floatUp 10s linear infinite;
}

.balloon img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
}

.balloon::after {
    content: '';
    position: absolute;
    width: 2px;
    height: 50px;
    background: #888;
    left: 50%;
    top: 110px;
}

@keyframes floatUp {
    from { transform: translateY(0); }
    to { transform: translateY(-120vh); }
}

/* Confetti */
.confetti {
    position: fixed;
    width: 10px;
    height: 10px;
    top: 0;
    animation: fall 3s linear infinite;
}

@keyframes fall {
    to {
        transform: translateY(100vh) rotate(360deg);
    }
}
</style>

</head>
<body>

<h1>hii em el noun 💙</h1>
<p>I Have a Question to Ask...</p>

<h1>So would you like to be my prom?</h1>
<p>You + me + prom = 💖</p>

<button class="yes" onclick="yesClicked()">YES 💕</button>
<button class="no" id="noBtn">NO 😭</button>

<script>
const noBtn = document.getElementById("noBtn");

// Move NO button away
noBtn.addEventListener("mouseover", () => {
    const x = Math.random() * (window.innerWidth - 100);
    const y = Math.random() * (window.innerHeight - 100);
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
});

// YES clicked
function yesClicked() {
    document.body.innerHTML = `
        <h1 style="margin-top:100px; color:#ff4f87;">
            🎉 Your promposal is here 🎉
        </h1>
        <p style="font-size:1.5em;">
            ask someone close... 💙
        </p>
    `;

    // Confetti
    for (let i = 0; i < 100; i++) {
        let conf = document.createElement("div");
        conf.classList.add("confetti");
        conf.style.left = Math.random() * 100 + "vw";
        conf.style.background = ["#ff4f87","#ffffff","#87c7ff"][Math.floor(Math.random()*3)];
        conf.style.animationDuration = (2 + Math.random()*2) + "s";
        document.body.appendChild(conf);
    }
}

// Balloons with image
const colors = ["#ffb6c1", "#ffffff", "#87c7ff"];

function createBalloon() {
    let balloon = document.createElement("div");
    balloon.classList.add("balloon");
    balloon.style.background = colors[Math.floor(Math.random()*colors.length)];
    balloon.style.left = Math.random() * window.innerWidth + "px";
    balloon.style.animationDuration = (6 + Math.random()*5) + "s";

    let img = document.createElement("img");
    img.src = "YOUR_IMAGE_HERE.jpg"; // <-- replace with your image file name
    balloon.appendChild(img);

    document.body.appendChild(balloon);

    setTimeout(() => {
        balloon.remove();
    }, 10000);
}

setInterval(createBalloon, 600);
</script>

</body>
</html>
